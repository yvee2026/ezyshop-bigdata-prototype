# Spark logging for the prototype (SPARK_CONF_DIR points here; the conf dir is on the driver classpath).
# Based on Spark's log4j2.properties.template. Root stays at WARN so real problems are visible.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# org.apache.spark.sql.kafka010.consumer.KafkaDataConsumer warns per fetch under foreachBatch; filled a benchmark log with
# 421k lines (TEST_LOG T12). Harmless for this workload, so only errors are kept.
logger.kafkaconsumer.name = org.apache.spark.sql.kafka010
logger.kafkaconsumer.level = error

# Third-party noise
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
logger.metrics.name = org.apache.hadoop.metrics2
logger.metrics.level = error
